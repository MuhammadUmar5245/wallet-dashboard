services:
  db:
    image: postgres:16
    container_name: wallet-db
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
      POSTGRES_DB: walletdb
    ports:
      - "5433:5432"          # optional: lets you open the DB from your PC (psql / DBeaver) on port 5433
    volumes:
      - walletdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d walletdb"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    container_name: wallet-app
    environment:
      DATABASE_URL: postgresql://wallet:wallet@db:5432/walletdb
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  walletdata:
